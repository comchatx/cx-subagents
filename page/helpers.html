          walk.hop = null;
          walk.p = [...h.to];
          walk.v = [0, 0];
          walk.g = h.g1;
          if (walk.on) sendTo(walk.goal, now, false);
        }
      } else if (walk.on) {
        for (const i of [0, 1]) {
          walk.v[i] += (BODY_OMEGA * BODY_OMEGA * (walk.goal[i] - walk.p[i]) - 2 * BODY_OMEGA * walk.v[i]) * dt;
          walk.p[i] += walk.v[i] * dt;
        }
      }
    };
    // What a frame needs of the walk: where cx is and how big, whether it is between two places, and how much it is writing — 1 while
    // text arrives and for a quarter second after, then falling to 0 over the next 0.3 s. A settled walk is where everything has arrived: the still frames, and
    // the reduced motion that draws only them, which show the pencil mid-stroke.
    const snap = (now, settled) => {
      const h = settled ? null : walk.hop;
      const u = h ? clamp01((now - h.start) / 1000 / h.dur) : 1;
      const p = settled ? walk.goal : walk.p;
      const s = lerp(1, walk.s, settled ? (walk.on ? 1 : 0) : walk.g);
      const from = h ? h.from : p;
      const dx = walk.goal[0] - from[0];
      const dy = walk.goal[1] - from[1];
      const len = Math.hypot(dx, dy) || 1;
      return Object.freeze({
        x: p[0], y: p[1], scale: s, away: walk.on,
        flight: h && u < 1 ? u : -1, lift: h ? h.lift : 0, dir: [dx / len, dy / len],
        writing: settled ? 1 : clamp01(1 - (now - walk.wrote - 250) / 300),
      });
    };
    const still = (st) => {
      const base = STATE[st].at(opts.stillAt);
      if (!scene) return base;
      const at = snap(performance.now(), true);
      return { ...sceneAt(st, opts.stillAt, opts.stillAt, Infinity, base, model, at), trip: at };
    };
    let last = scene ? sceneAt(opts.state, reduced ? opts.stillAt : 0, 0, Infinity, STATE[opts.state].at(reduced ? opts.stillAt : 0), model, snap(performance.now(), true)) : STATE[opts.state].at(reduced ? opts.stillAt : 0);
    const show = (node, on) => { node.style.display = on ? "" : "none"; };
    const drawn = new Map();
    const shape = (node, d) => { if (drawn.get(node) !== d) { drawn.set(node, d); node.setAttribute("d", d); } };
    const drawLines = (chars, opacity, withCaret) => {
      const count = Math.ceil(chars / LINE_CHARS);
      const first = Math.max(0, count - LINES_MAX);
      const width = SCR.w - 18;
      let end = null;
      lines.forEach((line, i) => {
        const at = first + i;
        const w = at >= count ? 0 : at < count - 1 ? width : Math.max(6, ((chars - at * LINE_CHARS) / LINE_CHARS) * width);
        shape(line, w > 0 ? mapped(toFace, [roundRect(-SCR.w / 2 + 9, -SCR.h / 2 + 8 + i * LINE_H, Math.round(w), LINE_BAR, LINE_BAR / 2)]) : "");
        line.setAttribute("opacity", f(opacity));
        if (w > 0) end = [-SCR.w / 2 + 9 + Math.round(w), -SCR.h / 2 + 8 + i * LINE_H];
      });
      shape(caret, withCaret && end ? mapped(toFace, [roundRect(Math.min(end[0] + 3, SCR.w / 2 - 9), end[1] - 1.5, 4, LINE_BAR + 3, 0.8)]) : "");
    };
    const drawReason = (reason) => { for (const key in symbols) show(symbols[key], key === reason); };
    const drawLed = (reading) => {
      const off = reading === "none" || reading === "asleep";
      const colour = reading === "starting" ? "var(--cx-warn)" : off ? "var(--cx-quiet)" : "var(--cx-good)";
      led.setAttribute("fill", reading === "heard" ? "none" : colour);
      led.setAttribute("stroke", colour);
      led.setAttribute("opacity", off ? "0.35" : "1");
      const pulsing = !reduced && (reading === "working" || reading === "starting");
      // The sidebar's dot pulsed while the box worked or started; the same pulse, run by the document so the frame loop can sleep.
      if (pulsing && !led.firstChild) led.appendChild(el("animate", { attributeName: "opacity", values: "0.3;1;0.3", dur: "1.6s", repeatCount: "indefinite" }));
      if (!pulsing) led.replaceChildren();
    };
    const drawScene = (fr, t) => {
      const m = model;
      const machine = machineOf(state, m);
      screenOn.setAttribute("opacity", f(fr.screen));
      content.setAttribute("opacity", f(Math.min(1, fr.screen * 1.4)));
      const lit = fr.screen > 0.02;
      show(bootG, lit && fr.boot > 0 && fr.boot < 0.999 && fr.screen > 0.3);
      const bw = Math.round(BOOT.w * clamp01(fr.boot) * 2) / 2;
      shape(bootFill, bw > 0.5 ? mapped(toFace, [roundRect(BOOT.x, BOOT.y, bw, BOOT.h, BOOT.h / 2)]) : "");
      show(reasonG, lit && machine === "refused");
      if (machine === "refused") drawReason(m.reason);
      const on = lit && (machine === "on" || machine === "unwatched");
      show(toolG, on && state === "analysing");
      if (on && state === "analysing") pulse.setAttribute("opacity", f(reduced ? 1 : 0.3 + 0.7 * (0.5 + 0.5 * Math.sin((t * 2 * Math.PI) / 1.6))));
      // The screen shows what is being written: the answer while text arrives, or else the person's draft for as long as it is in the
      // composer — typed or paused — and the message just sent while cx reads it; the caret while the draft is still a draft.
      const chars = on && state !== "analysing" ? (state === "writing" ? m.text : m.draft) : 0;
      drawLines(chars, state === "writing" ? 0.75 : 0.5, state === "ready" && !m.reading && !m.thinking);
      show(linesG, chars > 0);
      show(cornerG, on && m.low);
      // The struck key lights while the hand is down on it.
      shape(keyLight, fr.hit > 0.5 ? KEY_LIGHT[fr.hitKey] : "");
      drawLed(m.dot);
    };
    const draw = (fr, t) => {
      const s = fr.squash;
      body.setAttribute("transform", `translate(0 ${f(fr.dy)}) rotate(${f(fr.rotate)}) scale(${f(1 / Math.sqrt(s))} ${f(s)})`);
      drawEye(eyeL, 1, fr.eyes);
      drawEye(eyeR, -1, fr.eyesR || fr.eyes);
      drawArm(armL, fr.pose.left, -1, px);
      const unlanded = scene && model.catching === "reach" && !model.receipt;
      if (armL.item.getAttribute("data-unlanded") !== String(unlanded)) { armL.item.setAttribute("data-unlanded", String(unlanded)); armL.item.style.visibility = unlanded ? "hidden" : ""; }
      drawArm(armR, fr.pose.right, 1, px);
      // The z rides up and fades on each breath; nothing shows at all outside sleep.
      const z = fr.zz;
      zz.setAttribute("opacity", f(z > 0 && z < 1 ? 0.5 * Math.sin(z * Math.PI) : 0));
      zz.setAttribute("transform", `translate(${f(52 + 4 * z)} ${f(-48 - 12 * z)}) scale(${f(0.8 + 0.4 * z)})`);
      if (scene) {
        const at = fr.trip || snap(performance.now(), true);
        const ride = at.x || at.y || at.scale !== 1 ? `translate(${f(at.x)} ${f(at.y)}) scale(${f(at.scale)})` : "";
        rider.setAttribute("transform", ride);
        targets.cx.setAttribute("transform", ride);
        // Cut to the view while cx stands in the stream; a hop to or from the desk crosses the frame and is drawn whole.
        const cut = walk.on && walk.view !== null && !(walk.hop && walk.hop.lift === 1) ? `url(#${id}-view)` : "";
        if ((pane.getAttribute("clip-path") || "") !== cut) { if (cut) pane.setAttribute("clip-path", cut); else pane.removeAttribute("clip-path"); }
        // The arms keep their thickness for cx's size as it comes forward, so a long reach reads as an arm, not a thread.
        const armWidth = f(Math.max(1.1, HAND_STROKE * scale) * at.scale);
        if (hands.getAttribute("stroke-width") !== armWidth) hands.setAttribute("stroke-width", armWidth);
        // The thought dots come one after another and start again, while the model thinks; with reduced motion all three show.
        const think = fr.think || 0;
        thoughts.setAttribute("opacity", f(0.55 * think));
        const beat = reduced || t === undefined ? 0.9 : ((t * 0.8) % 1);
        [...thoughts.children].forEach((dot, i) => dot.setAttribute("opacity", beat > 0.12 + i * 0.22 ? "1" : "0.15"));
        drawScene(fr, t === undefined ? opts.stillAt : t);
      }
      last = fr;
    };

    let state = opts.state;
    let entered = performance.now();
    let blendFrom = null;
    let blendStart = 0;
    let raf = 0;
    let timer = 0;
    let lastDrawn = 0;
    let placed = false;
    let closed = false;
    const stop = () => {
      if (raf) cancelAnimationFrame(raf);
      if (timer) clearTimeout(timer);
      raf = 0;
      timer = 0;
    };
    // The animation owns its frame and its timer: a closed page or `destroy` cancels both for good, and an element that was in the
    // document and has left it cancels both until a signal finds it there again. A frame or a timer that outlived its page would draw
    // into a document that is gone.
    const dispose = () => { stop(); closed = true; };
    const frame = () => {
      if (closed) return;
      if (svg.isConnected) placed = true;
      else if (placed) { stop(); return; }
      if (!raf) raf = requestAnimationFrame(tick);
    };
    const tick = (now) => {
      raf = 0;
      if (closed || (placed && !svg.isConnected)) { stop(); return; }
      // A frame's time can fall a little before the moment its state was entered: the state starts at zero, never before.
      const t = Math.max(0, (now - entered) / 1000);
      const spec = STATE[state];
      const tapAge = Math.max(0, (now - lastTap) / 1000);
      if (scene) advance(now);
      const at = scene ? snap(now, false) : null;
      let fr = scene ? sceneAt(state, t, Math.max(0, (now - changed) / 1000), tapAge, spec.at(t), model, at) : spec.at(t);
      let blending = false;
      if (blendFrom) {
        const u = (now - blendStart) / 1000 / BLEND;
        if (u < 1) { fr = lerpFrame(blendFrom, fr, easeInOut(u)); blending = true; } else blendFrom = null;
      }
      if (spec.motion === "slow" && !blending && now - lastDrawn < SLOW_MS) { frame(); return; }
      if (scene) fr = { ...fr, trip: at };
      draw(fr, t);
      lastDrawn = now;
      // The scene's own motion: a move between two places, the pencil's strokes while text arrives, the yawn cycle while sleep is due,
      // the dots while the model thinks, and a keystroke for its length.
      const settling = scene && walk.on && (Math.hypot(walk.goal[0] - walk.p[0], walk.goal[1] - walk.p[1]) > 0.2 || Math.hypot(walk.v[0], walk.v[1]) > 0.2 || (state === "writing" && at.writing > 0));
      const moving = scene && (at.flight >= 0 || walk.hop !== null || settling || (state === "ready" && (model.sleepy || model.thinking || (model.typing && tapAge < TAP + 0.05))));
      if (blending || moving || spec.motion === "continuous" || spec.motion === "slow") { frame(); return; }
      if (spec.motion === "blink") {
        // Sleep until the next blink, then run frames for its length.
        const u = ((t - spec.blinkAt) % spec.period + spec.period) % spec.period;
        if (u < 0.2) { frame(); return; }
        timer = setTimeout(() => { timer = 0; frame(); }, Math.max(0, (spec.period - u) * 1000));
      }
    };
    const set = (next) => {
      if (!STATES.includes(next)) throw new Error(`cx: unknown state ${next}`);
      if (next === state) return;
      stop();
      state = next;
      svg.setAttribute("data-state", next);
      if (scene) svg.setAttribute("data-machine", machineOf(next, model));
      entered = performance.now();
      if (reduced) { draw(still(next)); return; }
      blendFrom = last;
      blendStart = entered;
      frame();
    };
    // The scene's signals: a partial model, and one keystroke of the person's. A change blends from the frame on screen as a state change does.
    // A signal that only changes what the screen, the light or the words show is drawn on the next frame; cx's pose is not blended again,
    // so text arriving many times a second leaves the pencil moving as it moves.
    const SCREEN_ONLY = Object.freeze(["draft", "text", "dot", "lang", "low"]);
    const redraw = () => {
      if (reduced) { draw(still(state)); return; }
      if (timer) { clearTimeout(timer); timer = 0; }
      frame();
    };
    const kick = () => {
      if (reduced) { draw(still(state)); return; }
      blendFrom = last;
      blendStart = performance.now();
      if (timer) { clearTimeout(timer); timer = 0; }
      frame();
    };
    const update = (partial) => {
      if (!scene) throw new Error("cx: no scene to update");
      const next = { ...model };
      for (const key in partial || {}) {
        if (!(key in SCENE_MODEL) || key === "key") throw new Error(`cx: unknown scene signal ${key}`);
        next[key] = partial[key];
      }
      if (next.reason !== undefined && !REASONS.includes(next.reason)) throw new Error(`cx: unknown reason ${next.reason}`);
      if (!DOTS.includes(next.dot)) throw new Error(`cx: unknown dot ${next.dot}`);
      if (![false, "watch", "reach"].includes(next.catching)) throw new Error(`cx: unknown catching ${next.catching}`);
      if (Object.keys(next).every((key) => next[key] === model[key])) return;
      const posed = Object.keys(next).some((key) => next[key] !== model[key] && !SCREEN_ONLY.includes(key));
      // Text arriving is what moves the pencil's point in its small strokes; they stop a little over half a second after the text does.
      if (next.text > model.text) walk.wrote = performance.now();
      model = Object.freeze(next);
      svg.setAttribute("data-machine", machineOf(state, model));
      if (!posed) { redraw(); return; }
      changed = performance.now();
      kick();
    };
    // Sends cx into the stream's margin, or back to its seat with `null`. The point says, in client pixels, beside what cx stands: `y` the
    // middle of the line being produced — the last line of text, a tool call's line, a thinking block's summary — and `start` where that
    // line begins, the answer's left edge; `left`, `top` and `bottom` bound the stream's view; `shift`, how far a scroll has moved the
    // line since cx was last placed. cx stands left of `start` with the pencil's point MARGIN_GAP clear of it, as big as the margin allows
    // up to AWAY_SCALE, beside the line wherever it is: a scroll carries cx with it as one piece, out of the view and back, cut to the
    // view; only a line still in view keeps cx above the view's foot. Nothing of cx ever lies over the answer. Where the margin cannot hold cx at its desk size, cx stays at its desk,
    // or goes back to it, and does the work there. Leaving the desk, coming back, the first place beside another kind of block and any
    // far move are hops; the rest glide. With reduced motion nothing glides or hops: cx is drawn where it would come to rest. Returns
    // whether cx is out.
    const away = (point) => {
      if (!scene) throw new Error("cx: no scene to leave");
      const now = performance.now();
      advance(now);
      let goal = null;
      let s = walk.s;
      if (point) {
        const r = svg.getBoundingClientRect();
        // Not laid out yet, or not a place: nothing to go by until the page asks again.
        if (!r.width || ![point.y, point.start, point.left, point.top, point.bottom].every(Number.isFinite)) return walk.on;
        const k = r.width / box.w;
        const X = (x) => (x - r.left) / k + box.x;
        const Y = (y) => (y - r.top) / k + box.y;
        const edge = X(point.start - MARGIN_GAP);
        s = Math.min(AWAY_SCALE, (edge - X(point.left)) / (FOOT.l + FOOT.r));
        if (s >= AWAY_MIN) {
          const hi = Y(point.bottom) - FOOT.b * s;
          goal = [edge - FOOT.r * s, point.y <= point.bottom ? Math.min(Y(point.y), hi) : Y(point.y)];
          walk.view = [X(point.left), Y(point.top), X(point.start) - X(point.left), Y(point.bottom) - Y(point.top)];
          viewRect.setAttribute("x", f(walk.view[0])); viewRect.setAttribute("y", f(walk.view[1]));
          viewRect.setAttribute("width", f(walk.view[2])); viewRect.setAttribute("height", f(walk.view[3]));
          // A scroll moves the line and cx together, as one piece: no glide is left to catch up.
          const dy = walk.on && Number.isFinite(point.shift) ? point.shift / k : 0;
          if (dy !== 0) {
            walk.p = [walk.p[0], walk.p[1] + dy];
            walk.goal = [walk.goal[0], walk.goal[1] + dy];
            if (walk.hop) walk.hop = Object.freeze({ ...walk.hop, from: [walk.hop.from[0], walk.hop.from[1] + dy], to: [walk.hop.to[0], walk.hop.to[1] + dy] });
          }
        }
      }
      if (!goal) {
        if (!walk.on) return false;
        walk.on = false;
        walk.kind = "";
        walk.goal = [0, 0];
        hopTo(walk.goal, now, "home");
      } else {
        const leaving = !walk.on;
        const newKind = state !== walk.kind;
        walk.on = true;
        walk.kind = state;
        walk.s = s;
        if (leaving) {
          walk.goal = goal;
          hopTo(goal, now, "leave");
        } else sendTo(goal, now, newKind);
      }
      svg.setAttribute("data-away", String(walk.on));
      if (reduced) {
        walk.hop = null;
        walk.p = [...walk.goal];
        walk.v = [0, 0];
        walk.g = walk.on ? 1 : 0;
        draw(still(state));
        return walk.on;
      }
      if (timer) { clearTimeout(timer); timer = 0; }
      frame();
      return walk.on;
    };

    // How far below its line's middle cx's figure reaches when it stands out beside a line beginning at `start` in a view whose left edge is
    // `left`, in client px, a breath's bob over it, at the size the margin gives it there: the room a line keeps under it for cx to stand.
    // The figure's reach is read from its poses as they are drawn, and the room kept for it only grows.
    let reachSeen = FOOT.b;
    const reach = (start, left) => {
      if (!scene) return 0;
      const r = svg.getBoundingClientRect();
      if (!r.width || !Number.isFinite(start) || !Number.isFinite(left)) return 0;
      const figure = typeof rider.getBBox === "function" ? rider.getBBox() : undefined;
      if (figure !== undefined) reachSeen = Math.max(reachSeen, figure.y + figure.height + 3);
      const k = r.width / box.w;
      return reachSeen * Math.min(AWAY_SCALE * k, (start - MARGIN_GAP - left) / (FOOT.l + FOOT.r));
    };

    const tap = () => {
      if (!scene) return;
      lastTap = performance.now();
      // The hands take turns: the right hand's keys are the first two, the far hand's the other two.
      const key = model.key > 1 ? Math.floor(Math.random() * 2) : 2 + Math.floor(Math.random() * 2);
      model = Object.freeze({ ...model, key });
      if (!reduced && !raf) { if (timer) { clearTimeout(timer); timer = 0; } frame(); }
    };

    if (scene) svg.setAttribute("data-machine", machineOf(state, model));
    resize(size);
    container.appendChild(svg);
    if (!reduced) frame();
    if (typeof addEventListener === "function") addEventListener("pagehide", (event) => { if (!event.persisted) dispose(); });

    // Where the receipt sits in the page, in client px, and how wide it is drawn: the one in cx's hand while it holds one, else the
    // place the receipt pose puts it. What flies to cx lands here, at this width.
    const slipPoint = () => {
      const held = armL.item.getAttribute("data-item") === "slip" ? armL.item.getBoundingClientRect() : null;
      const m = body.getScreenCTM();
      if (!m) return null;
      const w = 27 * Math.hypot(m.a, m.b);
      if (held && held.width > 0) return Object.freeze({ x: held.left + held.width / 2, y: held.top + held.height / 2, w });
      const a = (-105 * Math.PI) / 180;
      const mid = [SLIP_AT[0] + SLIP_MID[0] * Math.cos(a) - SLIP_MID[1] * Math.sin(a), SLIP_AT[1] + SLIP_MID[0] * Math.sin(a) + SLIP_MID[1] * Math.cos(a)];
      const pt = new DOMPoint(mid[0], mid[1]).matrixTransform(m);
      return Object.freeze({ x: pt.x, y: pt.y, w });
    };
    // The same, as the matrix from the receipt's own units to client px: the receipt in the hand while the hand holds one, drawn or
    // about to land, else where the receipt pose puts it. Something drawn with `slip()` under this matrix lies exactly on cx's receipt:
    // the same size, place, angle and line weight, so what flies to cx can end on it and give way to it without a seam.
    const slipMatrix = () => {
      const own = armL.item.getAttribute("data-item") === "slip" ? armL.item.getScreenCTM() : null;
      if (own) return DOMMatrix.fromMatrix(own);
      const arm = armL.g.getScreenCTM();
      return arm ? DOMMatrix.fromMatrix(arm).translate(SLIP_AT[0], SLIP_AT[1]).rotate(-105) : null;
    };
    // Whether the receipt is drawn in cx's hand now.
    const slipShown = () => armL.item.getAttribute("data-item") === "slip" && armL.item.style.visibility !== "hidden";
    const sceneApi = scene
      ? Object.freeze({
          update,
          tap,
          away,
          reach,
          slipPoint,
          slipMatrix,
          slipShown,
          slip: () => slipShape(px(0.9)),
          targets: Object.freeze(targets),
          get model() { return model; },
          get machine() { return machineOf(state, model); },
        })
      : undefined;
    return Object.freeze({
      element: svg,
      get state() { return state; },
      get size() { return size; },
      set,
      resize,
      scene: sceneApi,
      destroy: () => { dispose(); svg.remove(); },
    });
  };

  return Object.freeze({ STATES, REASONS, DOTS, WORDS, mount, MARK_W, BOX: VB, SCENE_BOX: SCENE_VB, COMPUTER_BOX, COMPUTER_PTS, TARGETS, hit: hitOf, machine: machineOf, MOTION, SLIP_MID, slip: (stroke = 0.9) => slipShape(stroke) });
});
</script>
<script>
(() => {
  "use strict";
  const board = window.cxBoard;
  const root = document.documentElement;
  const zh = () => !/^en\b/i.test(root.dataset.locale || board?.context?.locale || root.lang);

  /** Every line the page prints, by language, as the signed sheet draws it. */
  const WORDS = {
    zh: {
      seconds: (n) => `${n} 秒`, minutes: (n) => `${n} 分钟`, hoursMinutes: (hr, m) => `${hr} 小时 ${m} 分钟`,
      now: { sent: "正在处理" },
      ran: (t) => `已运行 ${t}`,
      waiting: "等待 cx 回答",
      paused: "已暂停",
      done: (at, t) => `${at} 完成，用时 ${t}`,
      stopped: (at) => `${at} 已停止`,
      limit: (at) => `${at} 用时超过 30 分钟，已停止`,
      error: (at) => `${at} 出错，已停止`,
      off: "cx 的电脑关机，已中断",
      named: (words, name) => `${words}“${name}”`,
      rename: "重命名", name: "名称",
      group: { going: "进行中", done: "已完成", cut: "未完成" },
      empty: "cx 交给帮手的事会显示在这里。",
      page: "帮手",
    },
    en: {
      seconds: (n) => `${n} sec`, minutes: (n) => `${n} min`, hoursMinutes: (hr, m) => `${hr} hr ${m} min`,
      now: { sent: "Working on it" },
      ran: (t) => `Running for ${t}`,
      waiting: "Waiting for cx's answer",
      paused: "Paused",
      done: (at, t) => `Done in ${t} · ${at}`,
      stopped: (at) => `Stopped · ${at}`,
      limit: (at) => `Stopped at the 30-minute limit · ${at}`,
      error: (at) => `Stopped by an error · ${at}`,
      off: "Interrupted when cx's computer switched off",
      named: (words, name) => `${words} “${name}”`,
      rename: "Rename", name: "Name",
      group: { going: "In progress", done: "Completed", cut: "Not finished" },
      empty: "What cx hands to helpers will be here.",
      page: "Helpers",
    },
  };
  const w = () => (zh() ? WORDS.zh : WORDS.en);

  // A face is a number the package gives each helper in order: the next of 108 ordered pairs of eleven colours. The colours stand round a
  // ring in an order in which neighbours differ most; face n in the first round takes a colour and its neighbour, in the next round the
  // colour two along, and so on. Forest with sand, either way round, is left out: forest left and sand right is cx.
  const RING = ["lake", "rust", "sand", "lilac", "cobalt", "olive", "mauve", "forest", "jade", "plum", "rose"];
  const OWN = new Set(["forest", "sand"]);
  const PAIRS = [];
  for (let round = 0; round < RING.length - 1; round++) for (let at = 0; at < RING.length; at++) {
    const left = RING[at], right = RING[(at + 1 + round) % RING.length];
    if (!(OWN.has(left) && OWN.has(right))) PAIRS.push([left, right]);
  }
  const token = (name) => (OWN.has(name) ? `var(--cx-${name})` : `var(--helper-${name})`);
  const pair = (n) => PAIRS[((n % PAIRS.length) + PAIRS.length) % PAIRS.length];

  const h = (tag, attrs, ...children) => {
    const node = document.createElement(tag);
    for (const [key, value] of Object.entries(attrs ?? {})) {
      if (value === undefined || value === null || value === false) continue;
      if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
      else node.setAttribute(key, value === true ? "" : String(value));
    }
    for (const child of children.flat(Infinity)) if (child !== undefined && child !== null && child !== false) node.append(child);
    return node;
  };
  const icon = (...paths) => {
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("class", "icon"); svg.setAttribute("viewBox", "0 0 24 24"); svg.setAttribute("aria-hidden", "true");
    for (const d of paths) { const path = document.createElementNS("http://www.w3.org/2000/svg", "path"); path.setAttribute("d", d); svg.append(path); }
    return svg;
  };
  const alertIcon = () => icon("M12 3.5a8.5 8.5 0 1 0 0 17 8.5 8.5 0 0 0 0-17z", "M12 8v5", "M12 16.4v.1");

  /** A card's file read: its front matter, one fact a line as JSON, and the task under it. */
  function readCard(file, raw) {
    const match = /^---\r?\n([\s\S]*?)\r?\n---\r?\n/.exec(raw);
    if (match === null) return undefined;
    const facts = {};
    for (const line of match[1].split(/\r?\n/)) {
      const at = line.indexOf(": ");
      if (at <= 0) continue;
      try { facts[line.slice(0, at)] = JSON.parse(line.slice(at + 2)); } catch { facts[line.slice(0, at)] = line.slice(at + 2); }
    }
    const at = Date.parse(facts.at), ended = Date.parse(facts.ended);
    if (facts.kind !== "helper" || !Number.isFinite(at)) return undefined;
    return { file, raw, name: String(facts.title ?? ""), face: Number.isInteger(facts.face) ? facts.face : 0, state: String(facts.state ?? "done"), at, ended: Number.isFinite(ended) ? ended : undefined, took: typeof facts.took === "number" ? facts.took : undefined };
  }

  const page = document.getElementById("page");
  /** The cards as last read, by file, each with the time its file had then. */
  const cards = new Map();
  /** What the seller has open on a card: its name's field. */
  const naming = new Set();

  /** A time since in the build's own words: seconds under a minute, then minutes, then hours and minutes. */
  const span = (seconds) => seconds < 60 ? w().seconds(Math.max(1, Math.floor(seconds))) : seconds < 3600 ? w().minutes(Math.floor(seconds / 60)) : w().hoursMinutes(Math.floor(seconds / 3600), Math.floor((seconds % 3600) / 60));
  const clock = (ms) => { const at = new Date(ms); return `${String(at.getHours()).padStart(2, "0")}:${String(at.getMinutes()).padStart(2, "0")}`; };
  const ran = (card) => Math.max(0, Math.floor((Date.now() - card.at) / 1000));
  const atWork = (card) => card.state === "working" || card.state === "waiting" || card.state === "paused";
  const groupOf = (card) => (atWork(card) ? "going" : card.state === "done" ? "done" : "cut");

  /** The line that says how it stands or how it ended. */
  function nowLine(card) {
    const end = card.ended ?? card.at;
    if (card.state === "working") return [w().now.sent];
    if (card.state === "waiting") return [w().waiting];
    if (card.state === "paused") return [w().paused];
    if (card.state === "done") return [w().done(clock(end), span(card.took ?? Math.round((end - card.at) / 1000)))];
    if (card.state === "stopped") return [w().stopped(clock(end))];
    return [alertIcon(), card.state === "timeout" ? w().limit(clock(end)) : card.state === "failed" ? w().error(clock(end)) : w().off];
  }

  /** A face: cx's figure in the card's two colours. At work it works, waiting or ended well it rests, ended badly it sleeps. */
  function face(card) {
    const fig = h("span", { class: "hc-fig" });
    const state = card.state === "working" ? "analysing" : card.state === "done" || card.state === "waiting" ? "ready" : "sleeping";
    queueMicrotask(() => { try { window.CxCharacter.mount(fig, { size: 28, state, motion: "auto" }); } catch { /* the figure is a picture; the card stands without it */ } });
    const [left, right] = pair(card.face);
    return h("span", { class: "hc-face", "aria-hidden": "true", "data-face": `${left}-${right}`, style: `--a: ${token(left)}; --b: ${token(right)};` }, fig);
  }

  /** Writes the seller's name into the card's file, read again first, so what the package wrote meanwhile stays. */
  async function rename(card, value) {
    const name = value.trim();
    naming.delete(card.file);
    if (name === "" || name === card.name) { draw(); return; }
    card.name = name;
    draw();
    try {
      const raw = await board.read(card.file);
      const next = raw.replace(/^title: .*$/m, `title: ${JSON.stringify(name)}`);
      if (next !== raw) await board.write(card.file, next);
    } catch { /* the board's next read draws the name the file holds */ }
  }

  /** The name fields open while the page draws again: each is put back as it stands, so its words, its caret and the keyboard stay. */
  let fields = new Map();
  function card(one) {
    const field = () => {
      const kept = fields.get(one.file);
      if (kept !== undefined) return kept;
      const input = h("input", { type: "text", class: "entry-field", dir: "auto", "aria-label": w().name, autocomplete: "off", value: one.name, "data-act": "name-field",
        onkeydown: (event) => {
          if (event.isComposing) return;
          if (event.key === "Enter") { event.preventDefault(); input.dataset.settled = "1"; rename(one, input.value).then(() => focusOn(one, '[data-act="name"]')); }
          if (event.key === "Escape") { event.preventDefault(); input.dataset.settled = "1"; naming.delete(one.file); draw(); focusOn(one, '[data-act="name"]'); }
        },
        onblur: () => { if (input.dataset.settled) return; input.dataset.settled = "1"; rename(one, input.value); } });
      return input;
    };
    const name = naming.has(one.file) ? field()
      : h("h3", { class: "hc-name", id: `${one.file}-name`, dir: "auto" },
        h("button", { type: "button", "data-act": "name", title: w().rename, "aria-label": w().named(w().rename, one.name), onclick: () => { naming.add(one.file); draw(); const input = document.getElementById(one.file)?.querySelector('[data-act="name-field"]'); input?.focus(); input?.select(); } }, one.name));
    const age = atWork(one) ? h("span", { class: "hc-age", "data-age": one.file, "aria-label": w().ran(span(ran(one))) }, span(ran(one))) : null;
    const head = h("div", { class: "hc-head" }, face(one),
      h("div", { class: "hc-id" }, h("div", { class: "hc-top" }, name), h("p", { class: "hc-now" }, h("span", { class: "hc-line" }, nowLine(one)), age)));
    return h("li", {}, h("article", { class: "entry hc-card", id: one.file, "data-state": one.state, "aria-labelledby": naming.has(one.file) ? undefined : `${one.file}-name`, "aria-label": naming.has(one.file) ? one.name : undefined }, head));
  }

  const focusOn = (one, selector) => document.getElementById(one.file)?.querySelector(selector)?.focus({ preventScroll: true });

  /** The page drawn from the cards: three groups in the order a seller looks for them, at work, done, not finished; newest first in each. */
  function draw() {
    const held = document.activeElement?.closest?.(".hc-card") ? { file: document.activeElement.closest(".hc-card").id, act: document.activeElement.dataset.act } : undefined;
    fields = new Map([...page.querySelectorAll('[data-act="name-field"]')].filter((input) => naming.has(input.closest(".hc-card")?.id) && !input.dataset.settled).map((input) => [input.closest(".hc-card").id, input]));
    const caret = held?.act === "name-field" ? [document.activeElement.selectionStart, document.activeElement.selectionEnd] : undefined;
    const shown = [...cards.values()].sort((a, b) => b.at - a.at || (a.file < b.file ? 1 : -1));
    const groups = ["going", "done", "cut"].map((key) => ({ key, cards: shown.filter((one) => groupOf(one) === key) })).filter((group) => group.cards.length > 0);
    page.replaceChildren(shown.length === 0 ? h("p", { class: "board-empty" }, w().empty)
      : groups.length === 1 ? h("ul", { class: "hc-list" }, groups[0].cards.map(card))
        : h("div", { class: "hc-groups", "data-n": String(groups.length) }, groups.map((group) =>
          h("section", { class: "hc-group", "data-group": group.key, "aria-labelledby": `group-${group.key}` }, h("h2", { id: `group-${group.key}` }, w().group[group.key]), h("ul", { class: "hc-list" }, group.cards.map(card))))));
    if (held && !naming.has(held.file) && held.act !== "name-field") document.getElementById(held.file)?.querySelector(`[data-act="${held.act}"]`)?.focus({ preventScroll: true });
    if (held?.act === "name-field" && naming.has(held.file)) { const input = document.getElementById(held.file)?.querySelector('[data-act="name-field"]'); input?.focus({ preventScroll: true }); if (caret !== undefined) input?.setSelectionRange(caret[0], caret[1]); }
    fields = new Map();
  }

  /** Reads the tab: each card whose file is new or changed is read again; a card the seller is naming keeps its field until it is left. */
  let reading = Promise.resolve();
  const read = () => (reading = reading.then(async () => {
    let listed;
    try { listed = await board.list(); } catch { return; }
    const want = new Map(listed.filter((row) => /-subagent-[A-Za-z0-9_-]+\.md$/.test(row.file) && !row.file.includes("/")).map((row) => [row.file, row]));
    let changed = false;
    for (const file of [...cards.keys()]) if (!want.has(file)) { cards.delete(file); changed = true; }
    await Promise.all([...want.values()].map(async (row) => {
      const had = cards.get(row.file);
      if (had !== undefined && had.modified === row.modified) return;
      let raw;
      try { raw = await board.read(row.file); } catch { return; }
      const one = readCard(row.file, raw);
      if (one === undefined) { if (had !== undefined) { cards.delete(row.file); changed = true; } return; }
      if (had !== undefined && naming.has(row.file)) one.name = had.name;
      cards.set(row.file, { ...one, modified: row.modified });
      changed = true;
    }));
    if (changed || page.childElementCount === 0) draw();
  }));

  if (board === undefined) { page.replaceChildren(h("p", { class: "board-empty" }, w().empty)); return; }
  board.on("files", read);
  board.on("context", () => { root.lang = zh() ? "zh" : "en"; document.title = w().page; draw(); });
  root.lang = zh() ? "zh" : "en";
  document.title = w().page;
  read();
  // How long each helper at work has run, kept up to the second.
  setInterval(() => {
    for (const one of cards.values()) if (atWork(one)) { const at = page.querySelector(`[data-age="${CSS.escape(one.file)}"]`); const words = span(ran(one)); if (at && at.textContent !== words) { at.textContent = words; at.setAttribute("aria-label", w().ran(words)); } }
  }, 1000);
})();
</script>
</body>
</html>
