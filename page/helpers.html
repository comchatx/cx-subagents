<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>帮手</title>
<!--
  The package's own page on the board, the tab 帮手 / Helpers, inside the board's frame. A card is one helper, read from its file in the
  tab: a face the package gives it, a name the seller can change, and a line that says how it stands. Helpers stand in three groups, at
  work, done and not finished: one under another in a narrow column, side by side as the board is dragged wider.
  The board hands the page its theme's values, cx's figure (`window.CxCharacter`, in cx's own colours) and the ready-made elements
  (`class="kit"`). What those do not give is in the style below: a card's state, a face's colours, and the groups. The one theme value
  the board does not hand a page, the outline of what ended with no result, is carried here, as the app's theme names it.
-->
<style>
  :root, [data-theme="light"] {
    --bad-line: #D8A398;
    --helper-lake: #2B85AA; --helper-plum: #792F67; --helper-lilac: #9478C4; --helper-cobalt: #274893; --helper-jade: #0D844C; --helper-rust: #6F2A00; --helper-mauve: #846375; --helper-rose: #C1628A; --helper-olive: #848F1E;
  }
  [data-theme="dark"] {
    --bad-line: #714F46;
    --helper-lake: #66B6DB; --helper-plum: #AF609A; --helper-lilac: #C0AAEC; --helper-cobalt: #5077CA; --helper-jade: #72D699; --helper-rust: #B66946; --helper-mauve: #A7919C; --helper-rose: #FF99C2; --helper-olive: #A2AE44;
  }
  .unseen { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
  #page { max-width: 40rem; margin: 0 auto; }
  .hc-list { display: flex; flex-direction: column; gap: var(--space-4); margin: 0; padding: 0; list-style: none; }
  /* The groups: one under another; from 40rem two columns, the helpers at work in the first; from 60rem a column each. */
  .hc-groups { display: grid; grid-template-columns: minmax(0, 1fr); align-items: start; gap: var(--space-6) var(--space-5); }
  .hc-group { display: flex; flex-direction: column; gap: var(--space-4); min-width: 0; }
  .hc-group > h2 { margin: 0; color: var(--quiet); font-size: var(--size-small); font-weight: var(--weight-strong); line-height: var(--leading-small); }
  @media (min-width: 40rem) {
    #page:has(.hc-groups) { max-width: 58rem; }
    .hc-groups { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .hc-groups[data-n="3"] { grid-template-rows: auto 1fr; }
    .hc-groups[data-n="3"] > .hc-group:first-child { grid-row: span 2; }
  }
  @media (min-width: 60rem) {
    #page:has(.hc-groups[data-n="3"]) { max-width: 88rem; }
    .hc-groups[data-n="3"] { grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: none; }
    .hc-groups[data-n="3"] > .hc-group:first-child { grid-row: auto; }
  }

  /* A card's state: a helper at work is outlined as the chat's running step is, one that ended with no result as the build outlines what failed. */
  .hc-card { position: relative; }
  .hc-card[data-state="working"] { border-color: var(--live-edge); }
  .hc-card[data-state="failed"], .hc-card[data-state="timeout"], .hc-card[data-state="off"] { border-color: var(--bad-line); }

  /* The head: the face, the name over the line that says how it stands. */
  .hc-head { display: flex; align-items: flex-start; gap: var(--space-3); }
  .hc-id { flex: 1 1 auto; min-width: 0; }
  .hc-top { --row: calc(var(--space-7) + var(--space-2)); display: flex; align-items: flex-start; gap: var(--space-3); min-height: var(--row); }
  .hc-name { flex: 1 1 auto; min-width: 0; margin: 0; padding-top: var(--space-2); font-size: var(--size-body); font-weight: var(--weight-strong); line-height: var(--leading-small); overflow-wrap: anywhere; }
  .hc-name, .hc-name > button, .hc-card[data-state="working"] .hc-line { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden; }
  .hc-name:has(> button) { display: block; overflow: visible; padding-top: 0; }
  /* Under a pointer the name takes the board's own shade behind it, as any button does, and nothing else. */
  .hc-name > button { max-width: calc(100% + var(--space-2)); min-height: var(--row); -webkit-box-pack: center; margin-inline-start: calc(var(--space-2) * -1); padding: 0 var(--space-2); border: none; border-radius: var(--radius-small); background: none; color: inherit; font: inherit; text-align: start; overflow-wrap: anywhere; }
  /* The name's field stands where the name stood, in the name's own box and letters, so nothing around it moves. */
  .hc-top > .entry-field { flex: 1 1 auto; min-width: 0; height: var(--row); margin-inline-start: calc(var(--space-2) * -1 - 1px); padding: 0 var(--space-2); border-radius: var(--radius-small); font-size: var(--size-body); font-weight: var(--weight-strong); line-height: var(--leading-small); }
  .hc-card .entry-field:focus-visible { outline: 2px solid var(--act); outline-offset: -2px; }

  /* A face: cx's own figure with one ring in each of two colours, a little into the card's padding so its figure lines up with the words. */
  .hc-face { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 3.5rem; height: 2.75rem; margin-inline-start: calc(var(--space-2) * -1); }
  .hc-fig { display: inline-flex; --cx-forest: var(--a); --cx-forest-shade: var(--a); --cx-sand: var(--b); --cx-sand-shade: var(--b); }
  .hc-fig > svg { display: block; }

  /* The line that says how it stands, and how long at its end while it is at work. */
  .hc-now { display: flex; align-items: baseline; gap: var(--space-4); margin: 0; color: var(--quiet); font-size: var(--size-small); line-height: var(--leading-small); }
  .hc-line { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
  .hc-line > .icon { width: var(--size-small); height: var(--size-small); margin-inline-end: var(--space-2); vertical-align: -0.125em; }
  .hc-age { flex: none; color: var(--quiet); font-size: var(--size-caption); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .hc-card[data-state="working"] .hc-line { color: var(--ink); }
  .hc-card[data-state="failed"] .hc-line, .hc-card[data-state="timeout"] .hc-line, .hc-card[data-state="off"] .hc-line { color: var(--bad); }

  /* The steps: done with a filled tick and quiet words, the one in work with the build's ring and strong words, one not started with a dashed round. */
  .hc-steps { display: flex; flex-direction: column; gap: var(--space-2); margin: 0; padding: 0; list-style: none; font-size: var(--size-small); line-height: var(--leading-small); }
  .hc-steps > li { display: flex; align-items: flex-start; gap: var(--space-3); min-width: 0; overflow-wrap: anywhere; }
  .hc-steps > li > span:last-child { min-width: 0; }
  .hc-step-mark { flex: none; display: inline-flex; align-items: center; justify-content: center; width: var(--size-small); height: 1lh; }
  .hc-step-mark > svg { display: block; width: var(--size-small); height: var(--size-small); }
  /* The build's ring, as the Plugins page draws it; the board hands a page its colours and not that rule. */
  .hc-spin { display: inline-block; width: var(--size-caption); height: var(--size-caption); border: 1.5px solid var(--live-edge); border-top-color: var(--ink); border-radius: var(--radius-round); animation: hc-spin 0.8s linear infinite; }
  @keyframes hc-spin { to { transform: rotate(1turn); } }
  @media (prefers-reduced-motion: reduce) { .hc-spin { animation-duration: 2.4s; } }
  .hc-steps > li[data-step="done"] { color: var(--quiet); }
  .hc-steps > li[data-step="now"] { font-weight: var(--weight-strong); }
  .hc-steps > li[data-step="todo"] .hc-step-mark, .hc-steps > li[data-step="held"] .hc-step-mark { color: var(--edge); }
  .hc-steps > li[data-step="cut"] .hc-step-mark { color: var(--bad); }
  .hc-card[data-state="stopped"] .hc-steps > li[data-step="cut"] .hc-step-mark { color: var(--edge); }

  /* What a helper wrote, under its head: each file the board's file box, one under another, as wide as its name. Past three the list
     stops at two and one press under it leads to the whole list, so a card never holds more than three rows of files. */
  .hc-files { display: flex; flex-direction: column; align-items: flex-start; gap: var(--space-2); margin: 0; padding: 0; list-style: none; }
  .hc-files > li { display: flex; max-width: 100%; min-width: 0; }
  .hc-files .file-ref { text-align: start; cursor: pointer; }
  /* A page it read, by its address: the colour of a press, one line, cut at its end; under a pointer the board's shade for a button. It
     opens where a link in the chat opens, in a new tab of the browser. */
  .hc-page { display: inline-flex; align-items: center; gap: var(--space-3); min-width: 0; max-width: calc(100% + var(--space-2) * 2); min-height: var(--space-7); margin-inline: calc(var(--space-2) * -1); padding: 0 var(--space-2); border-radius: var(--radius-small); color: var(--act); font-size: var(--size-small); line-height: var(--leading-small); text-decoration: none; }
  .hc-page:hover { background: var(--hover); color: var(--act-hover); text-decoration: none; }
  :where([data-theme="dark"]) .hc-page:hover { background: var(--float-hover); }
  .hc-page > .icon { flex: none; width: var(--size-small); height: var(--size-small); }
  .hc-page > span[dir] { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* A quiet press: its words, how many it holds, and at its end a mark that leads on. */
  .hc-quiet { display: flex; align-items: center; gap: var(--space-3); width: fit-content; min-height: var(--space-7); margin-inline-start: calc(var(--space-2) * -1); padding: 0 var(--space-2); border: none; border-radius: var(--radius-small); background: none; color: var(--quiet); font-size: var(--size-small); line-height: var(--leading-small); }
  .hc-quiet:hover:not(:disabled) { color: var(--ink); }
  .hc-quiet > .icon { flex: none; width: var(--size-small); height: var(--size-small); }
  /* A press sits close under the list it leads on from, one to a row. */
  .entry.hc-card > .hc-quiet { margin-top: 0; }
  .hc-card :is(button, a):focus-visible, .hc-all :is(button, a):focus-visible { outline: 2px solid var(--act); outline-offset: 2px; }

  /* One helper's whole list, in the cards' place: the way back, the helper, then what it wrote and what it read. The way back stays at the
     page's top while a long list goes under it; a row the keyboard brings into view stops below it. */
  .hc-all { display: flex; flex-direction: column; align-items: flex-start; gap: var(--space-5); }
  .hc-all > .hc-head, .hc-all > section, .hc-all > .hc-back { align-self: stretch; }
  .hc-all > .hc-back { position: sticky; top: 0; z-index: 1; margin: calc(var(--space-5) * -1) calc(var(--space-6) * -1) calc(var(--space-3) * -1); padding: var(--space-5) var(--space-6) var(--space-3); background: var(--ground); }
  html:has(.hc-all) { scroll-padding-top: calc(var(--space-8) + var(--space-6)); }
  .hc-all > section { display: flex; flex-direction: column; gap: var(--space-3); min-width: 0; }
  .hc-all h3 { margin: 0; color: var(--quiet); font-size: var(--size-small); font-weight: var(--weight-strong); line-height: var(--leading-small); }
  .hc-all .hc-name { padding-top: 0; }
  .hc-all :is(h2, h3):focus { outline: none; }
  .hc-all[data-state="failed"] .hc-line, .hc-all[data-state="timeout"] .hc-line, .hc-all[data-state="off"] .hc-line { color: var(--bad); }

  /* A mark to press beside the name: a glyph in a round, its word on hover and in its name, as the Inbox's cards have it. */
  .hc-acts { flex: none; display: flex; align-items: center; min-height: var(--row); margin-inline-end: calc(var(--space-2) * -1); }
  .hc-mark { flex: none; display: inline-flex; align-items: center; justify-content: center; width: var(--space-7); height: var(--space-7); padding: 0; border: none; border-radius: var(--radius-round); background: none; color: var(--quiet); }
  .hc-mark:hover:not(:disabled), .hc-mark[aria-expanded="true"] { color: var(--ink); }
  .hc-mark > .icon { width: var(--size-body); height: var(--size-body); }
  /* A question before a stop: words, and the presses at the end. */
  .hc-ask { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--space-3) var(--space-4); }
  .hc-ask > p { flex: 1 1 16rem; margin: 0; font-size: var(--size-small); line-height: var(--leading-small); }
  .hc-ask > div { display: flex; gap: var(--space-4); margin-inline-start: auto; }
  /* The message for the helper is written in the chat's own message box, which the board hands the page as it is. */
  .hc-card > .cx-box { margin: 0; }
  .hc-note { margin: 0; color: var(--quiet); font-size: var(--size-small); line-height: var(--leading-small); }
</style>
</head>
<body class="kit">
<div class="kit-page" id="page"></div>
<span class="unseen" role="status" id="said"></span>
<script>
(() => {
  "use strict";
  const board = window.cxBoard;
  const root = document.documentElement;
  const zh = () => !/^en\b/i.test(root.dataset.locale || board?.context?.locale || root.lang);

  /** Every line the page prints, by language, as the signed sheet draws it. */
  const WORDS = {
    zh: {
      seconds: (n) => `${n} 秒`, minutes: (n) => `${n} 分钟`, hoursMinutes: (hr, m) => `${hr} 小时 ${m} 分钟`,
      now: { sent: "正在处理" },
      ran: (t) => `已运行 ${t}`,
      waiting: "等待 cx 回答",
      paused: "已暂停",
      done: (at, t) => `${at} 完成，用时 ${t}`,
      stopped: (at) => `${at} 已停止`,
      limit: (at) => `${at} 用时超过 30 分钟，已停止`,
      error: (at) => `${at} 出错，已停止`,
      off: "cx 的电脑关机，已中断",
      named: (words, name) => `${words}“${name}”`,
      rename: "重命名", name: "名称",
      pause: "暂停", resume: "继续", stop: "停止", remove: "移除", cancel: "取消",
      stopAsk: (name) => `停止“${name}”？停止后无法继续。`,
      tell: "发消息", say: (name) => `给“${name}”发消息`, sayHere: "给帮手发消息", sent: "已交给 cx",
      group: { going: "进行中", done: "已完成", cut: "未完成" },
      step: { done: "已完成", now: "进行中", todo: "未开始", held: "已暂停", cut: "未完成" },
      empty: "cx 交给帮手的事会显示在这里。",
      page: "帮手",
      allFiles: (n) => `查看全部 ${n} 个文件`, references: (n) => `${n} 份参考资料`, createdFiles: (n) => `生成的 ${n} 个文件`,
      back: (name) => `← ${name}`, fileOpen: (name) => `${name}，在看板中查看`, newTab: "（在新标签页打开）",
    },
    en: {
      seconds: (n) => `${n} sec`, minutes: (n) => `${n} min`, hoursMinutes: (hr, m) => `${hr} hr ${m} min`,
      now: { sent: "Working on it" },
      ran: (t) => `Running for ${t}`,
      waiting: "Waiting for cx's answer",
      paused: "Paused",
      done: (at, t) => `Done in ${t} · ${at}`,
      stopped: (at) => `Stopped · ${at}`,
      limit: (at) => `Stopped at the 30-minute limit · ${at}`,
      error: (at) => `Stopped by an error · ${at}`,
      off: "Interrupted when cx's computer switched off",
      named: (words, name) => `${words} “${name}”`,
      rename: "Rename", name: "Name",
      pause: "Pause", resume: "Resume", stop: "Stop", remove: "Remove", cancel: "Cancel",
      stopAsk: (name) => `Stop “${name}”? It can't be resumed afterwards.`,
      tell: "Message", say: (name) => `Message “${name}”`, sayHere: "Message the helper", sent: "Sent to cx",
      group: { going: "In progress", done: "Completed", cut: "Not finished" },
      step: { done: "Done", now: "In progress", todo: "Not started", held: "Paused", cut: "Not finished" },
      empty: "What cx hands to helpers will be here.",
      page: "Helpers",
      allFiles: (n) => `Show all ${n} files`, references: (n) => (n === 1 ? "1 reference" : `${n} references`), createdFiles: (n) => (n === 1 ? "Created 1 file" : `Created ${n} files`),
      back: (name) => `← ${name}`, fileOpen: (name) => `${name}, show on the board`, newTab: " (Opens in a new tab)",
    },
  };
  const w = () => (zh() ? WORDS.zh : WORDS.en);
  /** What the page sends for a helper: its name as a group chat names a person, then the seller's words. */
  const toCx = (name, words) => `**@${name}** ${words}`;

  // A face is a number the package gives each helper in order: the next of 108 ordered pairs of eleven colours. The colours stand round a
  // ring in an order in which neighbours differ most; face n in the first round takes a colour and its neighbour, in the next round the
  // colour two along, and so on. Forest with sand, either way round, is left out: forest left and sand right is cx.
  const RING = ["lake", "rust", "sand", "lilac", "cobalt", "olive", "mauve", "forest", "jade", "plum", "rose"];
  const OWN = new Set(["forest", "sand"]);
  const PAIRS = [];
  for (let round = 0; round < RING.length - 1; round++) for (let at = 0; at < RING.length; at++) {
    const left = RING[at], right = RING[(at + 1 + round) % RING.length];
    if (!(OWN.has(left) && OWN.has(right))) PAIRS.push([left, right]);
  }
  const token = (name) => (OWN.has(name) ? `var(--cx-${name})` : `var(--helper-${name})`);
  const pair = (n) => PAIRS[((n % PAIRS.length) + PAIRS.length) % PAIRS.length];

  const h = (tag, attrs, ...children) => {
    const node = document.createElement(tag);
    for (const [key, value] of Object.entries(attrs ?? {})) {
      if (value === undefined || value === null || value === false) continue;
      if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
      else node.setAttribute(key, value === true ? "" : String(value));
    }
    for (const child of children.flat(Infinity)) if (child !== undefined && child !== null && child !== false) node.append(child);
    return node;
  };
  const icon = (...paths) => {
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("class", "icon"); svg.setAttribute("viewBox", "0 0 24 24"); svg.setAttribute("aria-hidden", "true");
    for (const d of paths) { const path = document.createElementNS("http://www.w3.org/2000/svg", "path"); path.setAttribute("d", d); svg.append(path); }
    return svg;
  };
  const alertIcon = () => icon("M12 3.5a8.5 8.5 0 1 0 0 17 8.5 8.5 0 0 0 0-17z", "M12 8v5", "M12 16.4v.1");

  /** A card's file read: its front matter, one fact a line as JSON, and the task under it. */
  function readCard(file, raw) {
    const match = /^---\r?\n([\s\S]*?)\r?\n---\r?\n/.exec(raw);
    if (match === null) return undefined;
    const facts = {};
    for (const line of match[1].split(/\r?\n/)) {
      const at = line.indexOf(": ");
      if (at <= 0) continue;
      try { facts[line.slice(0, at)] = JSON.parse(line.slice(at + 2)); } catch { facts[line.slice(0, at)] = line.slice(at + 2); }
    }
    const at = Date.parse(facts.at), ended = Date.parse(facts.ended), since = Date.parse(facts.since);
    if (facts.kind !== "helper" || !Number.isFinite(at)) return undefined;
    const steps = Array.isArray(facts.steps) ? facts.steps.filter((one) => typeof one?.words === "string" && one.words !== "" && ["done", "now", "todo"].includes(one.state)) : [];
    const list = (value) => (Array.isArray(value) ? value.filter((one) => typeof one === "string" && one !== "") : []);
    return pressedAs({ file, raw, name: String(facts.title ?? ""), face: Number.isInteger(facts.face) ? facts.face : 0, state: String(facts.state ?? "done"), at, ended: Number.isFinite(ended) ? ended : undefined, took: typeof facts.took === "number" ? facts.took : undefined, ran: typeof facts.ran === "number" ? facts.ran : 0, since: Number.isFinite(since) ? since : undefined, files: list(facts.files), reads: list(facts.reads), steps, press: typeof facts.press === "string" ? facts.press : undefined });
  }

  /**
   * A card as the seller's press leaves it, while the press waits in its file for the package to do: paused, at work again, stopped, or
   * gone. The package writes the card again once it is done, and the card is then drawn as the run stands.
   */
  function pressedAs(one) {
    const ran = one.ran + (one.state === "working" && one.since !== undefined ? Math.max(0, Math.floor((Date.now() - one.since) / 1000)) : 0);
    if (one.press === "pause" && (one.state === "working" || one.state === "waiting")) return { ...one, state: "paused", ran, since: undefined };
    if (one.press === "resume" && one.state === "paused") return { ...one, state: "working", since: Date.now() };
    if (one.press === "stop" && atWork(one)) return { ...one, state: "stopped", ended: Date.now(), ran, since: undefined };
    return one;
  }

  const NS = "http://www.w3.org/2000/svg";
  const draft = (markup) => { const svg = document.createElementNS(NS, "svg"); svg.setAttribute("viewBox", "0 0 16 16"); svg.setAttribute("aria-hidden", "true"); svg.innerHTML = markup; return svg; };
  /** A step's mark: a filled tick, the build's ring, a dashed round, a round with two bars where it was paused, a round with a bar where it was cut off. */
  function stepMark(state) {
    if (state === "now") return h("span", { class: "hc-spin", "aria-hidden": "true" });
    if (state === "done") return draft('<circle cx="8" cy="8" r="7" fill="currentColor"/><path d="M4.8 8.3l2.2 2.2 4.2-4.6" fill="none" stroke="var(--raised)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>');
    if (state === "held") return draft('<circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M6.4 5.6v4.8M9.6 5.6v4.8" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>');
    if (state === "cut") return draft('<circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M5.2 8h5.6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>');
    return draft('<circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-dasharray="2.4 2.2"/>');
  }
  /** A step as its card stands: the one in work held while the helper is paused or waits, and cut off once it ended, done or not, while the step was still in work. */
  const stepAs = (card, state) => state !== "now" ? state : card.state === "paused" || card.state === "waiting" ? "held" : card.state === "working" ? "now" : "cut";
  function stepsOf(one) {
    if (one.steps.length === 0) return null;
